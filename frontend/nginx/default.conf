server {
    listen 80;
    root /usr/share/nginx/html;
    # Docker DNS, resolved at request time: nginx starts even when the emulator container is not running
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
    }

    # Emulator panel: /emulator-api/boxes -> emulator:8001/api/boxes
    # A proxy_pass with a variable keeps the rewritten URI, so the path is rebuilt explicitly
    location /emulator-api/ {
        set $emulator http://emulator:8001;
        rewrite ^/emulator-api/(.*)$ /api/$1 break;
        proxy_pass $emulator;
        proxy_set_header Host $host;
    }

    location = /config.yaml {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
    }
}
