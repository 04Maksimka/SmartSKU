server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location = /config.yaml {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
    }
}
