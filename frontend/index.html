<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSKU</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6f8;
        --surface: #ffffff;
        --surface-2: #fafbfc;
        --border: #e3e6eb;
        --chip: #eef0f3;
        --text: #1b1f24;
        --muted: #6b7380;
        --accent: #3b82f6;
        --accent-soft: rgba(59, 130, 246, 0.18);
        --tone-neutral: #4b5563;
        --tone-neutral-bg: #eef0f3;
        --tone-good: #15803d;
        --tone-good-bg: #dcfce7;
        --tone-bad: #b91c1c;
        --tone-bad-bg: #fee2e2;
        --tone-warn: #a16207;
        --tone-warn-bg: #fef3c7;
        --tone-info: #1d4ed8;
        --tone-info-bg: #dbeafe;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1216;
          --surface: #171b21;
          --surface-2: #1c2129;
          --border: #2a303a;
          --chip: #242a33;
          --text: #e6e9ee;
          --muted: #8b94a3;
          --accent: #60a5fa;
          --accent-soft: rgba(96, 165, 250, 0.2);
          --tone-neutral: #c3c9d3;
          --tone-neutral-bg: #262c36;
          --tone-good: #4ade80;
          --tone-good-bg: rgba(74, 222, 128, 0.12);
          --tone-bad: #f87171;
          --tone-bad-bg: rgba(248, 113, 113, 0.13);
          --tone-warn: #fbbf24;
          --tone-warn-bg: rgba(251, 191, 36, 0.12);
          --tone-info: #93c5fd;
          --tone-info-bg: rgba(96, 165, 250, 0.14);
        }
      }

      body {
        margin: 0;
        padding: 0 20px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <p style="padding: 24px">Загрузка…</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
