server:
  host: 0.0.0.0
  port: 8001

mqtt:
  host: localhost
  port: 1883
  topic_prefix: smartsku
  reconnect_interval_seconds: 3
  keepalive_seconds: 30
  provision_timeout_seconds: 5

publish_interval_seconds: 0.5
# Gaussian noise (std, grams) added to every weight reading, 0 disables it
weight_noise_grams: 0.0
# Emulates ESP non-volatile memory: box_id received during provisioning survives restarts
identity_store_path: var/box_identities.json
# Weights, piece weights and cell placement survive a restart, like a real box after a power cycle
fleet_state_path: var/fleet_state.json
log_level: INFO

boxes:
  - hardware_id: emu-box-001
    lockers_count: 4
    # Cells start empty and uncalibrated
    cells:
      - {locker_id: 0, nfc_id: cell-0001}
      - {locker_id: 1, nfc_id: cell-0002}
      - {locker_id: 2, nfc_id: cell-0003}
      - {locker_id: 3, nfc_id: cell-0004}

loose_cells:
  - {nfc_id: cell-0005}
