server:
  host: 0.0.0.0
  port: 8000

database:
  # Relative to backend/; ./backend/var on the VPS is bind-mounted
  path: var/smartsku.db
  busy_timeout_seconds: 30
  echo: false

mqtt:
  host: mosquitto
  port: 1883
  client_id: smartsku-backend
  topic_prefix: smartsku
  reconnect_interval_seconds: 3
  keepalive_seconds: 30
  # Password: secrets/backend.yaml on the VPS (SMARTSKU_BACKEND_SECRETS)
  username: backend

telemetry:
  # Grams. Boxes filter their own noise (report steps of 0.5 g or half a piece), so this only drops float jitter
  weight_change_threshold: 0.05

scale:
  # Load cell setup from the dashboard: how long a request waits for the box to measure
  answer_timeout_seconds: 10

onboarding:
  # Broker address sent to a box connected from the dashboard over Bluetooth: the domain, TLS on 8883.
  # box_password: secrets/backend.yaml on the VPS
  broker_host: app-smartsku.online
  broker_port: 8883
  broker_tls: true
  box_username: box
  # New boxes are registered only after "Подключить бокс" on the dashboard, within this time
  claim_ttl_minutes: 30

logging:
  level: INFO
