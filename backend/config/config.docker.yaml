server:
  host: 0.0.0.0
  port: 8000

database:
  # Relative to backend/; in Docker ./backend/var is bind-mounted, so the DB file is visible on the host
  path: var/smartsku.db
  busy_timeout_seconds: 30
  echo: false

mqtt:
  host: mosquitto
  port: 1883
  client_id: smartsku-backend
  topic_prefix: smartsku
  reconnect_interval_seconds: 3
  keepalive_seconds: 30

telemetry:
  # Weight is in arbitrary units (real boxes: raw HX711 counts, they filter their own noise; emulator: grams).
  # Weight changes below this value are not treated as a state change
  weight_change_threshold: 0.5

onboarding:
  # Broker address sent to a box connected from the dashboard over Bluetooth: IP or name.local of this computer.
  # Empty: the dashboard suggests the host it was opened with (and asks for it when opened as localhost)
  broker_host: ""
  broker_port: 1883
  # New boxes are registered only after "Подключить бокс" on the dashboard, within this time
  claim_ttl_minutes: 30

logging:
  level: INFO
