# Cloud (VPS) overrides: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Only Caddy is reachable from outside; the other services talk inside the Docker network.
# Docker publishes ports past ufw, so internal services must not publish any.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  mosquitto:
    restart: unless-stopped
    ports: !reset []

  backend:
    restart: unless-stopped
    ports: !reset []

  frontend:
    restart: unless-stopped
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
