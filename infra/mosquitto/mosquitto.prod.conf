# Cloud broker (docker-compose.prod.yml). Everyone logs in; boxes come over TLS from the internet,
# the backend over plain TCP inside the Docker network (1883 is not published).
per_listener_settings false
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

listener 1883

# Let's Encrypt certificate of the domain, copied from Caddy by infra/mosquitto/sync-cert.sh (reloaded on SIGHUP)
listener 8883
certfile /mosquitto/secrets/tls/cert.pem
keyfile /mosquitto/secrets/tls/key.pem

persistence true
persistence_location /mosquitto/data/
log_dest stdout
